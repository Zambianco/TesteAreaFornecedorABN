<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ABN · Avaliação de fornecedores</title>
<link rel="icon" href="/mirror-assets/d9aa3b39c9c2d3c0c5b96c19.svg"><link rel="stylesheet" href="/mirror-assets/6d7cfeca62c4560462b1ba05.css"><link rel="stylesheet" href="/mirror-assets/b60e796bda2f3b3aaf614b14.css"><link rel="stylesheet" href="/mirror-assets/04bc6fb18700c56c8cc76ac4.css"><link rel="stylesheet" href="/mirror-assets/c8b1ee5659bd6408232be7ee.css">
<style>
:root{--main:#ffcd1a;--title:#2c2c2c;--text:#575757;--white:#fff;--black:#000;--line:#d9d9d9;--footer1:#212b55;--footer2:#0d1741;--footer-design:#00032d}*{box-sizing:border-box}.supplier-page{margin:0;color:var(--text);background:#f6f6f6}.supplier-page a{text-decoration:none}.supplier-page header{background:#fff}.supplier-page header .navbar{min-height:108px}.supplier-nav{display:flex;align-items:center;gap:25px;margin-left:auto;font-weight:600}.supplier-nav a{color:var(--title)}.supplier-nav a:hover{color:#8d7200}.supplier-nav form{margin:0}.supplier-nav button{border:0;background:none;font:inherit;font-weight:600;padding:0;color:var(--title);cursor:pointer}.supplier-main{min-height:540px;padding:74px 16px;background:linear-gradient(135deg,#f4f5f7 0%,#fff 55%,#f7f0d1 100%)}.supplier-card{max-width:720px;margin:0 auto;background:#fff;padding:46px 52px;border-top:5px solid var(--main);box-shadow:0 14px 45px rgba(13,23,65,.10)}.supplier-card h1{margin:0;color:var(--title);font-size:38px;line-height:1.15}.supplier-card .title-rule{width:72px;border:0;border-top:4px solid var(--main);opacity:1;margin:18px 0 24px}.intro{font-size:18px;margin-bottom:28px}.supplier-card label{display:block;color:var(--title);font-weight:700;margin-bottom:6px}.supplier-card input{width:100%;padding:13px 15px;border:1px solid #d1d1d1;background:#fff;font:inherit;border-radius:0}.supplier-card input:focus{outline:2px solid var(--main);outline-offset:1px}.supplier-card button,.supplier-card .button{display:inline-block;border:0;background:var(--footer1);color:#fff;padding:13px 24px;font-weight:700;cursor:pointer}.supplier-card button:hover,.supplier-card .button:hover{background:var(--footer2);color:#fff}.supplier-card table{width:100%;border-collapse:collapse;margin-top:22px}.supplier-card th,.supplier-card td{padding:14px;border-bottom:1px solid #ddd;text-align:left}.supplier-card th{color:var(--title)}.errorlist{color:#a52323;padding-left:20px}.helptext{display:block;font-size:14px;margin-top:5px}.message{background:#edf7ed;border-left:4px solid #399448;padding:12px}.admin-actions{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin:24px 0}.form-link{margin-top:22px}.password-modal-backdrop{position:fixed;inset:0;z-index:9999;background:rgba(13,23,65,.72);display:flex;align-items:center;justify-content:center;padding:20px}.password-modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:#fff;padding:38px;border-top:5px solid var(--main);box-shadow:0 20px 70px rgba(0,0,0,.35)}.password-modal h2{color:var(--title);margin-top:0}@media(max-width:767px){.supplier-page header .navbar{min-height:86px}.supplier-nav{gap:12px;font-size:14px;flex-wrap:wrap;justify-content:flex-end}.supplier-card{padding:34px 24px}.supplier-card h1{font-size:30px}}
.supplier-welcome{margin:0 0 30px;padding:24px 26px;background:#f7f8fb;border-left:5px solid var(--main)}.supplier-welcome span{display:block;font-size:16px}.supplier-welcome strong{display:block;margin:4px 0 8px;color:var(--footer1);font-size:25px;line-height:1.25}.supplier-welcome p{margin:0}</style></head><body class="supplier-page"><header class="sticky"><div class="container"><nav class="navbar navbar-light"><div class="navbar-brand"><a href="/" aria-label="Página inicial"><img src="/mirror-assets/a83b64c8bda0a3e5e9b118b6.svg" width="120" height="50" alt="ABN Equipamentos"></a></div><div class="supplier-nav"><a href="/">Site da ABN</a>{% if user.is_authenticated %}<a href="{% url 'dashboard' %}">Minhas avaliações</a><a href="{% url 'password_change' %}">Alterar senha</a><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Sair</button></form>{% endif %}</div></nav></div></header><main class="supplier-main"><section class="supplier-card">{% for message in messages %}<p class="message">{{ message }}</p>{% endfor %}<h1>{{ title|default:'Avaliação de fornecedores' }}</h1><hr class="title-rule">{% block content %}{% endblock %}</section></main>{% include 'includes/site_footer.html' %}<script>document.querySelectorAll('[data-cnpj-mask]').forEach(function(input){function formatCnpj(value){var digits=value.replace(/\D/g,'').slice(0,14);if(digits.length>12)return digits.slice(0,2)+'.'+digits.slice(2,5)+'.'+digits.slice(5,8)+'/'+digits.slice(8,12)+'-'+digits.slice(12);if(digits.length>8)return digits.slice(0,2)+'.'+digits.slice(2,5)+'.'+digits.slice(5,8)+'/'+digits.slice(8);if(digits.length>5)return digits.slice(0,2)+'.'+digits.slice(2,5)+'.'+digits.slice(5);if(digits.length>2)return digits.slice(0,2)+'.'+digits.slice(2);return digits}input.maxLength=18;input.addEventListener('input',function(){input.value=formatCnpj(input.value)});input.value=formatCnpj(input.value)});</script></body></html>
